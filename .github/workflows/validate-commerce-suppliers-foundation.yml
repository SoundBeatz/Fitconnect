name: Validate Commerce Suppliers Foundation
on:
  pull_request:
    branches: [hostinger-static]
    paths:
      - 'admin/supplier-*.js'
      - 'admin/index.html'
      - '.github/workflows/validate-commerce-suppliers-foundation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          node --check admin/supplier-repository.js
          node --check admin/supplier-service.js
          node --check admin/supplier-store.js
          node --check admin/supplier-renderer.js
          grep -q "from('suppliers')" admin/supplier-repository.js
          ! grep -q "from('suppliers')" admin/supplier-service.js
          ! grep -q "from('suppliers')" admin/supplier-store.js
          ! grep -q "from('suppliers')" admin/supplier-renderer.js
          ! grep -q 'ProductStore\|BrandStore' admin/supplier-store.js
          ! grep -q 'ProductStore\|BrandStore' admin/supplier-renderer.js
          grep -q 'subscribeEvent' admin/supplier-store.js
          grep -q 'supplier.saved' admin/supplier-store.js
          test ! -e admin/supplier-v1-bridge.js
          grep -q 'supplier-renderer.js?v=20260802-commerce-suppliers-renderer-v1' admin/index.html
