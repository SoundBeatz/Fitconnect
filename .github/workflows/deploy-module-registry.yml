name: Deploy Module Registry

on:
  push:
    branches:
      - hostinger-static
    paths:
      - 'admin/module-registry-v2.js'
      - 'admin/interface.js'
      - 'admin/auth-flow.js'
      - 'src/modules/registry/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-module-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-module-registry
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-static

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production target and registry migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_REF" = "lwpiqshyqzsgwejvmbyo"
          test -f supabase/migrations/202607270001_core_module_registry.sql
          test -f supabase/migrations/202607270003_normalize_combination_deals_module_key.sql
          test -f supabase/migrations/202607270004_verify_canonical_module_registry.sql
          grep -q "organization_modules" supabase/migrations/202607270001_core_module_registry.sql
          grep -q "module_is_enabled" supabase/migrations/202607270001_core_module_registry.sql
          grep -q "'combination_deals'" supabase/migrations/202607270004_verify_canonical_module_registry.sql

      - name: Apply and verify Module Registry migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deployment summary
        run: |
          echo '## Enterprise Module Registry deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical platform modules preserved and expanded' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tenant and workspace activation with RLS enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Dependencies, trials, configuration and audit events enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Server-side module availability function installed' >> "$GITHUB_STEP_SUMMARY"