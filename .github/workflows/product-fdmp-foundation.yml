name: Validate Product FDMP Foundation

on:
  pull_request:
    branches:
      - hostinger-static

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply PR102 legacy removal
        if: github.head_ref == 'fdmp/legacy-product-removal-pr102'
        run: python3 .github/scripts/product-legacy-removal-pr102.py

      - name: Validate Product FDMP architecture
        run: |
          set -euo pipefail
          node --check admin/product-config.js
          node --check admin/product-repository.js
          node --check admin/product-service.js
          node --check admin/product-store.js
          node --check admin/product-renderer.js
          node --check admin/admin.js
          grep -q "from('products')" admin/product-repository.js
          ! grep -q "from('products')" admin/product-service.js
          ! grep -q "from('products')" admin/product-store.js
          ! grep -q "from('products')" admin/product-renderer.js
          ! grep -q "querySelector\|getElementById" admin/product-service.js
          ! grep -q "querySelector\|getElementById" admin/product-store.js
          grep -q "getFitConnectSupabase" admin/product-renderer.js
          grep -q "specifications.SKU" docs/migrations/products/FDMP_PR100_ACCEPTANCE.md
          for asset in product-config product-repository product-service product-store; do
            grep -q "${asset}.js?v=20260802-product-fdmp-1" admin/index.html
          done
          grep -q "product-renderer.js?v=20260802-product-renderer-v1" admin/index.html
          test ! -f admin/product-v1-bridge.js
          if [ "${{ github.head_ref }}" = "fdmp/legacy-product-removal-pr102" ]; then
            ! grep -q "from('products')" admin/admin.js
            ! grep -qE '(^|[^A-Za-z])products\s*=\s*\[\]' admin/admin.js
            ! grep -q 'function renderProducts' admin/admin.js
            ! grep -q "#productRows.*innerHTML" admin/admin.js
          fi

      - name: Commit PR102 migration
        if: github.head_ref == 'fdmp/legacy-product-removal-pr102'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'FitConnect Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/admin.js admin/product-renderer.js
          git commit -m 'Remove legacy product ownership from admin monolith'
          git push origin HEAD:fdmp/legacy-product-removal-pr102
