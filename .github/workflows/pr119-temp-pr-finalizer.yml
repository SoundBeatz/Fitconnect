name: PR119 Self-Cleaning Commerce Release Finalizer
on:
  pull_request:
    branches: [hostinger-static]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-commerce-release-pr119.py
      - name: Remove transition scaffolding
        run: |
          rm .github/scripts/finalize-commerce-release-pr119.py
          rm .github/workflows/pr119-temp-pr-finalizer.yml
      - name: Commit Commerce release harmonization
        run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harmonize Commerce release cache tags'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
