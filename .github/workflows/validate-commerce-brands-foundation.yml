name: Validate Commerce Brands Foundation

on:
  pull_request:
    branches: [hostinger-static]
    paths:
      - 'admin/brand-*.js'
      - 'admin/index.html'
      - 'docs/migrations/commerce/FDMP_PR106_ACCEPTANCE.md'
      - '.github/workflows/validate-commerce-brands-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Brands FDMP foundation
        run: |
          set -euo pipefail
          node --check admin/brand-repository.js
          node --check admin/brand-service.js
          node --check admin/brand-store.js
          node --check admin/brand-v1-bridge.js
          grep -q "from('brands')" admin/brand-repository.js
          ! grep -q "from('brands')" admin/brand-service.js
          ! grep -q "from('brands')" admin/brand-store.js
          ! grep -q "from('brands')" admin/brand-v1-bridge.js
          ! grep -q "querySelector\|getElementById" admin/brand-service.js
          ! grep -q "querySelector\|getElementById" admin/brand-store.js
          ! grep -q "ProductStore\|SupplierStore" admin/brand-store.js
          grep -q "subscribeEvent" admin/brand-store.js
          grep -q "brand.saved" admin/brand-store.js
          grep -q "fitconnect:brand-saved" admin/brand-v1-bridge.js
          grep -q "event.stopImmediatePropagation" admin/brand-v1-bridge.js
          TAG='20260802-commerce-brands-foundation-v1'
          for asset in brand-repository brand-service brand-store brand-v1-bridge; do
            grep -q "${asset}.js?v=${TAG}" admin/index.html
          done
