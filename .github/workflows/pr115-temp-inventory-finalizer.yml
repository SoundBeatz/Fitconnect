name: PR115 Temporary Inventory Finalizer
on:
  push:
    branches: [main]
    paths: ['.github/pr115-inventory-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-inventory-foundation-pr115
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-inventory-pr115.py
      - run: rm .github/scripts/finalize-inventory-pr115.py
      - run: |
          set -euo pipefail
          for file in admin/inventory-persistence-adapter.js admin/inventory-repository.js admin/inventory-service.js admin/inventory-store.js admin/inventory-v1-bridge.js; do node --check "$file"; done
          grep -q 'inventory-persistence-adapter.js?v=20260802-commerce-inventory-foundation-v1' admin/index.html
          grep -q 'inventory-v1-bridge.js?v=20260802-commerce-inventory-foundation-v1' admin/index.html
      - run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html .github/scripts/finalize-inventory-pr115.py
          git commit -m 'Bootstrap Inventory FDMP foundation'
          git push origin HEAD:feature/commerce-inventory-foundation-pr115
