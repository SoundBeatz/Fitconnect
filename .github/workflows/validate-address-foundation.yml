name: Validate Address FDMP Renderer

on:
  pull_request:
    branches: [hostinger-static]
    paths:
      - 'admin/address-*.js'
      - 'admin/auth-flow.js'
      - '.github/workflows/validate-address-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required layers
        run: |
          test -f admin/address-config.js
          test -f admin/address-repository.js
          test -f admin/address-service.js
          test -f admin/address-store.js
          test -f admin/address-factories.js
          test -f admin/address-renderer.js
          test ! -f admin/address-v1-bridge.js
      - name: Validate JavaScript syntax
        run: |
          node --check admin/address-config.js
          node --check admin/address-repository.js
          node --check admin/address-service.js
          node --check admin/address-store.js
          node --check admin/address-factories.js
          node --check admin/address-renderer.js
          node --check admin/auth-flow.js
      - name: Enforce factory-owned serialization
        run: |
          grep -q 'AddressFormFactory' admin/address-factories.js
          grep -q 'serialize(form' admin/address-factories.js
          ! grep -nE '\.value|\.checked|data-address-(line1|line2|postal-code|city|region|country-code)' admin/address-renderer.js
      - name: Enforce granular event rendering
        run: |
          grep -q 'fitconnect:address-submit' admin/address-renderer.js
          grep -q 'patchCustomer' admin/address-renderer.js
          grep -q 'rollback' admin/address-renderer.js
          ! grep -nE 'innerHTML|replaceChildren|setInterval|MutationObserver' admin/address-renderer.js admin/address-factories.js
      - name: Enforce isolation
        run: |
          ! grep -nE '\.from\(|\.rpc\(' admin/address-config.js admin/address-service.js admin/address-store.js admin/address-factories.js admin/address-renderer.js
          ! grep -nE 'ProductStore|InventoryStore|OrderStore|InvoiceStore' admin/address-*.js
      - name: Enforce immutable snapshot contract
        run: |
          grep -q 'createAddressSnapshot' admin/address-repository.js
          grep -q 'shipping_address_snapshot' admin/address-config.js
          grep -q 'billing_address_snapshot' admin/address-config.js
          grep -q '#state' admin/address-store.js
          grep -q 'deepFreeze\|DeepFreeze' admin/address-store.js admin/address-repository.js
      - name: Enforce parser-synchronous ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          auth=Path('admin/auth-flow.js').read_text()
          required=['address-config.js','address-repository.js','address-service.js','address-store.js','address-factories.js','address-renderer.js']
          assert all(name in auth for name in required)
          assert 'address-v1-bridge.js' not in auth
          assert auth.index('address-config.js') < auth.index('address-repository.js') < auth.index('address-service.js') < auth.index('address-store.js') < auth.index('address-factories.js') < auth.index('address-renderer.js')
          PY
      - name: Enforce zero UI impact
        run: |
          ! git diff --name-only origin/hostinger-static...HEAD | grep -E '^admin/.*\.(html|css)$'
