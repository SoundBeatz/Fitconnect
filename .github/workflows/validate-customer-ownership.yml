name: Validate FDMP Customer Ownership

on:
  pull_request:
    branches: [hostinger-static]
    paths:
      - 'admin/admin.js'
      - 'admin/auth-flow.js'
      - 'admin/customer-*.js'
      - '.github/workflows/validate-customer-ownership.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check admin/auth-flow.js
          node --check admin/customer-repository.js
          node --check admin/customer-service.js
          node --check admin/customer-store.js
          node --check admin/customer-factories.js
          node --check admin/customer-renderer.js
      - name: Enforce monolith cleanup
        run: |
          ! grep -nE 'let customers *=|function renderCustomers|renderCustomers\(|function editCustomer|editCustomer\(' admin/admin.js
          ! grep -nE "\.from\(['\"](profiles|invoice_customers)['\"]\)" admin/admin.js admin/auth-flow.js
          ! grep -nE 'customers\.filter|customers\.map|customers *=' admin/admin.js
      - name: Enforce active Customer repository ownership
        run: |
          offenders=$(grep -nE "\.from\(['\"](profiles|invoice_customers)['\"]\)" admin/admin.js admin/auth-flow.js admin/customer-config.js admin/customer-service.js admin/customer-store.js admin/customer-factories.js admin/customer-renderer.js || true)
          test -z "$offenders" || { echo "$offenders"; exit 1; }
          grep -q "from('profiles')" admin/customer-repository.js
          grep -q "from('invoice_customers')" admin/customer-repository.js
          grep -q 'getAuthorizationProfile' admin/customer-repository.js
      - name: Protect adjacent domains
        run: |
          ! grep -nE 'function loadOrders|function renderOrders|function renderOrderDetail|function bindOrderControls' admin/admin.js
          test -f admin/order-repository.js
          test -f admin/order-renderer.js
          grep -q 'function renderTraining' admin/admin.js
          grep -q 'function renderWarranty' admin/admin.js
          grep -q 'function renderService' admin/admin.js
          grep -q "#logoutButton" admin/admin.js
          grep -q 'function renderAll(){renderStats();renderTraining();renderWarranty();renderService()}' admin/admin.js
      - name: Enforce Customer renderer ownership
        run: |
          grep -q "document.getElementById('customerRows')" admin/customer-renderer.js
          grep -q 'replaceWith' admin/customer-renderer.js
          ! grep -nE "\.from\(|\.rpc\(" admin/customer-renderer.js admin/customer-factories.js admin/customer-service.js admin/customer-store.js
