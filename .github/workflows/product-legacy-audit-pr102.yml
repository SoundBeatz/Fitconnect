name: Product Legacy Audit PR102
on:
  push:
    branches: [fdmp/legacy-product-removal-pr102]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdmp/legacy-product-removal-pr102
      - name: Print product ownership symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('admin/admin.js').read_text()
          names=re.findall(r'(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(',text)
          print('FUNCTIONS')
          for n in names:
            if any(k in n.lower() for k in ['product','image','seo','spec','media','recent','stat']): print(n)
          print('\nPRODUCT TOKENS')
          for pat in [r"from\('products'\)",r'products\s*=\s*\[\]',r'#productRows',r'#productForm',r'renderProducts\(',r'loadProducts\(',r'currentImages']:
            print(pat, len(re.findall(pat,text)))
          print('\nLINES')
          for i,line in enumerate(text.splitlines(),1):
            if any(x in line for x in ["from('products')",'renderProducts(','loadProducts(','#productRows','#productForm','currentImages']):
              print(f'{i}: {line[:1200]}')
          PY
