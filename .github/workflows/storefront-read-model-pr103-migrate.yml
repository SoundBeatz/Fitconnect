name: Storefront Read Model PR103 Migration
on:
  push:
    branches: [hostinger-static]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdmp/storefront-read-model-pr103
          fetch-depth: 0
      - run: python3 .github/scripts/storefront-read-model-pr103.py
      - name: Validate migration
        run: |
          set -euo pipefail
          node --check shop/storefront-product-repository.js
          node --check shop/storefront-product-store.js
          node --check shop/shop.js
          node --check shop/product/product.js
          ! grep -q "rest/v1/products" shop/shop.js
          ! grep -q "rest/v1/products" shop/product/product.js
          ! grep -q "select=\*" shop/product/product.js
          grep -q "eq('status','active')" shop/storefront-product-repository.js
          grep -q "purchase_price" shop/storefront-product-repository.js
          grep -q "storefrontProductStore" shop/shop.js
          grep -q "storefrontProductStore" shop/product/product.js
      - name: Commit migration
        run: |
          git config user.name 'FitConnect Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add shop/shop.js shop/product/product.js shop/index.html shop/product/index.html
          git commit -m 'Migrate public shop to isolated storefront read model' || exit 0
          git push origin HEAD:fdmp/storefront-read-model-pr103
