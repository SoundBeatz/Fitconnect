name: PR113 Temporary Categories Renderer Finalizer
on:
  push:
    branches: [main]
    paths: ['.github/pr113-temp-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-categories-renderer-pr113
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-categories-renderer-pr113.py
      - run: rm admin/category-v1-bridge.js .github/scripts/finalize-categories-renderer-pr113.py
      - run: |
          node --check admin/category-renderer.js
          node --check shop/storefront-category-repository.js
          node --check shop/storefront-category-store.js
          node --check shop/storefront-category-presenter.js
          test ! -e admin/category-v1-bridge.js
          grep -q 'category-renderer.js?v=20260802-commerce-categories-renderer-v1' admin/index.html
          grep -q 'storefront-category-presenter.js?v=20260802-commerce-categories-renderer-v1' shop/index.html
      - run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html shop/index.html admin/category-v1-bridge.js .github/scripts/finalize-categories-renderer-pr113.py
          git commit -m 'Finalize Categories renderer modernization'
          git push origin HEAD:feature/commerce-categories-renderer-pr113
