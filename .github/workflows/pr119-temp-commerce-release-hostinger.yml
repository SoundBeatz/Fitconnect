name: PR119 Commerce Release Trusted Finalizer
on:
  push:
    branches: [hostinger-static]
    paths: ['.github/pr119-commerce-release-hostinger-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-release-harmonization-pr119
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-commerce-release-pr119.py
      - run: rm .github/scripts/finalize-commerce-release-pr119.py
      - name: Commit Commerce release harmonization
        run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harmonize Commerce release cache tags'
          git push origin HEAD:feature/commerce-release-harmonization-pr119
