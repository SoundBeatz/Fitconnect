name: PR114 Temporary Categories Legacy Removal
on:
  push:
    branches: [main]
    paths: ['.github/pr114-temp-trigger.txt']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-categories-legacy-removal-pr114
          fetch-depth: 0
      - name: Run migrator with diagnostics
        run: |
          set +e
          python3 .github/scripts/remove-legacy-categories-pr114.py > pr114-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> pr114-diagnostic.txt
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add pr114-diagnostic.txt admin/index.html shop/index.html shop/shop.js shop/storefront-product-repository.js shop/storefront-category-presenter.js
          git commit -m 'Record PR114 migration diagnostic'
          git push origin HEAD:feature/commerce-categories-legacy-removal-pr114
