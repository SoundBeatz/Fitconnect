name: PR114 Temporary Categories Legacy Removal
on:
  push:
    branches: [main]
    paths: ['.github/pr114-temp-trigger.txt']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-categories-legacy-removal-pr114
          fetch-depth: 0
      - run: python3 .github/scripts/remove-legacy-categories-pr114.py
      - run: rm .github/scripts/remove-legacy-categories-pr114.py
      - name: Validate migration
        run: |
          set -euo pipefail
          node --check admin/admin.js
          node --check shop/shop.js
          node --check shop/storefront-product-repository.js
          node --check shop/storefront-category-presenter.js
          ! grep -q "neq('category','Voeding')" shop/storefront-product-repository.js
          ! grep -q '>Kracht</option>\|>Cardio</option>\|>Voeding</option>' admin/index.html shop/index.html
          grep -q "categorySlug(record.category)!=='nutrition'" shop/storefront-product-repository.js
          grep -q 'fitconnect:storefront-category-selected' shop/shop.js
          grep -q 'fitconnect:storefront-category-selected' shop/storefront-category-presenter.js
      - name: Commit to PR branch
        run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html shop/index.html shop/shop.js shop/storefront-product-repository.js shop/storefront-category-presenter.js .github/scripts/remove-legacy-categories-pr114.py
          git commit -m 'Remove legacy Categories presentation ownership'
          git push origin HEAD:feature/commerce-categories-legacy-removal-pr114
