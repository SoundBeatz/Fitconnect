name: PR108 Temporary Brands Legacy Removal
on:
  push:
    branches: [hostinger-static]
    paths:
      - '.github/pr108-temp-trigger.txt'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-brands-legacy-removal-pr108
          fetch-depth: 0
      - run: python3 .github/scripts/remove-legacy-brands-pr108.py
      - run: rm .github/scripts/remove-legacy-brands-pr108.py
      - name: Validate legacy removal
        run: |
          set -euo pipefail
          node --check admin/admin.js
          ! grep -q "from('brands')" admin/admin.js
          ! grep -q 'let brands=\[\]' admin/admin.js
          ! grep -q 'function renderBrands(' admin/admin.js
          ! grep -q 'function editBrand(' admin/admin.js
          ! grep -q 'function syncBrandOptions(' admin/admin.js
          grep -q "from('suppliers')" admin/admin.js
          grep -q 'function renderSuppliers(' admin/admin.js
          grep -q 'renderAll();' admin/admin.js
          grep -q "\$('#logoutButton')" admin/admin.js
      - name: Commit to PR branch
        run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/admin.js .github/scripts/remove-legacy-brands-pr108.py
          git commit -m 'Remove legacy Brands ownership from admin monolith'
          git push origin HEAD:feature/commerce-brands-legacy-removal-pr108
