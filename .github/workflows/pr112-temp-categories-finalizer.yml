name: PR112 Temporary Categories Finalizer
on:
  push:
    branches: [main]
    paths: ['.github/pr112-temp-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commerce-categories-foundation-pr112
          fetch-depth: 0
      - run: python3 .github/scripts/finalize-categories-foundation-pr112.py
      - run: rm .github/scripts/finalize-categories-foundation-pr112.py
      - run: |
          node --check admin/category-repository.js
          node --check admin/category-service.js
          node --check admin/category-store.js
          node --check admin/category-v1-bridge.js
          grep -q 'category-v1-bridge.js?v=20260802-commerce-categories-foundation-v1' admin/index.html
      - run: |
          git config user.name 'FitConnect Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html .github/scripts/finalize-categories-foundation-pr112.py
          git commit -m 'Finalize Categories foundation bootstrap'
          git push origin HEAD:feature/commerce-categories-foundation-pr112
