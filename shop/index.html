<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitConnect Shop | Fitnessapparatuur</title>
<meta name="description" content="Professionele fitnessapparatuur geselecteerd door FitConnect.">
<style>
:root{--bg:#f4f0e8;--ink:#171717;--muted:#6b675f;--card:#fff;--line:#d9d2c6;--dark:#151515;--accent:#d8ff3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{font-weight:800;display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--dark);color:#fff;border-radius:12px}.links{display:flex;gap:20px;font-size:14px}.hero,.section{max-width:1240px;margin:auto;padding:54px clamp(20px,5vw,72px)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(44px,7vw,78px);letter-spacing:-.05em;line-height:.95;margin:12px 0 20px}.lead{font-size:19px;line-height:1.6;color:var(--muted);max-width:760px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.tools input,.tools select{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:190px}.status{padding:14px 16px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.visual{aspect-ratio:4/3;background:#eeebe4 center/contain no-repeat;display:block}.copy{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.brandline{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}h3{font-size:22px;margin:0}.desc{color:var(--muted);line-height:1.5;min-height:48px}.meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.price{font-size:20px;font-weight:800}.btn{border:0;background:var(--dark);color:#fff;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--muted)}.cart{position:fixed;right:18px;bottom:18px;background:var(--dark);color:#fff;padding:14px 18px;border-radius:999px;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.18)}@media(max-width:900px){.links{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="/"><span class="mark">FC</span><span>FitConnect</span></a><nav class="links"><a href="/sports-configurator/">Training configurator</a><a href="/configurator/">Gym ontwerp</a><a href="/">Home</a></nav></header>
<main>
<section class="hero"><div class="eyebrow">FitConnect Shop</div><h1>Equipment dat past bij je training.</h1><p class="lead">De shop leest alleen publieke productdata uit FitConnect. Geen externe JavaScript-SDK, geen zware storefront-runtime.</p></section>
<section class="section"><div class="tools"><input id="q" type="search" placeholder="Zoek product of merk"><select id="brand"><option value="">Alle merken</option></select></div><div id="status" class="status">Producten laden…</div><div id="grid" class="grid" style="margin-top:18px"></div></section>
</main>
<a class="cart" href="/shop/?cart=open">Winkelmand <span id="cartCount">0</span></a>
<script>
(()=>{'use strict';
const API='https://lwpiqshyqzsgwejvmbyo.supabase.co/rest/v1';
const KEY='sb_publishable_b4uU82UPeAcOGFtyvx5NxA_6e3A_RBj';
const headers={apikey:KEY,Authorization:'Bearer '+KEY};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n||0));
const q=document.getElementById('q'),brand=document.getElementById('brand'),grid=document.getElementById('grid'),status=document.getElementById('status'),cartCount=document.getElementById('cartCount');
let products=[];
function cart(){try{return JSON.parse(localStorage.getItem('fitconnect-cart')||'[]')}catch{return[]}}
function updateCart(){const items=cart();cartCount.textContent=Array.isArray(items)?items.reduce((n,i)=>n+Number(i.quantity||1),0):0}
function add(id){const items=cart();const found=items.find(i=>i.productId===id);if(found)found.quantity=Number(found.quantity||1)+1;else items.push({productId:id,quantity:1});localStorage.setItem('fitconnect-cart',JSON.stringify(items));updateCart()}
function render(){const term=q.value.trim().toLowerCase(),b=brand.value;const shown=products.filter(p=>(!b||p.brand===b)&&(`${p.name} ${p.brand} ${p.model||''} ${p.category||''}`).toLowerCase().includes(term));status.textContent=`${shown.length} ${shown.length===1?'product':'producten'} gevonden`;grid.innerHTML=shown.length?shown.map(p=>{const img=Array.isArray(p.images)?p.images.find(v=>typeof v==='string'&&/^https?:\/\//.test(v)):'';return `<article class="card"><a class="visual" href="product/?slug=${encodeURIComponent(p.slug)}"${img?` style="background-image:url('${esc(img)}')"`:''}></a><div class="copy"><div class="brandline">${esc(p.brand)}${p.model?' · '+esc(p.model):''}</div><h3><a href="product/?slug=${encodeURIComponent(p.slug)}">${esc(p.name)}</a></h3><div class="desc">${esc(p.short_description||'Professioneel geselecteerd door FitConnect.')}</div><div class="meta"><span class="price">${euro(p.price)}</span><button class="btn" data-add="${esc(p.id)}">Toevoegen</button></div></div></article>`}).join(''):'<div class="empty">Geen producten gevonden.</div>';grid.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>add(btn.dataset.add))}
async function init(){updateCart();try{const url=`${API}/products?select=id,slug,brand,model,name,category,price,short_description,images&status=eq.active&order=featured.desc,created_at.desc`;const r=await fetch(url,{headers,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);products=await r.json();const brands=[...new Set(products.map(p=>p.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));brand.innerHTML='<option value="">Alle merken</option>'+brands.map(x=>`<option>${esc(x)}</option>`).join('');render()}catch(e){console.error(e);status.textContent='De shopdata kon niet worden geladen.';grid.innerHTML='<div class="empty">De productcatalogus is tijdelijk niet beschikbaar. De rest van de website blijft veilig bereikbaar.</div>'}}
q.addEventListener('input',render);brand.addEventListener('change',render);init();
})();
</script>
</body>
</html>
