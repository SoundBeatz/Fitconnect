<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | FitConnect Shop</title>
<style>
:root{--bg:#f4f0e8;--ink:#171717;--muted:#6a665e;--card:#fff;--line:#d9d2c6;--dark:#151515}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}.brand{font-weight:800}.wrap{max-width:1180px;margin:auto;padding:40px clamp(20px,5vw,72px) 80px}.back{display:inline-block;margin-bottom:24px;color:var(--muted)}.product{display:grid;grid-template-columns:1fr 1fr;gap:36px}.media{background:#fff;border:1px solid var(--line);border-radius:24px;min-height:520px;background-position:center;background-repeat:no-repeat;background-size:contain}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}h1{font-size:clamp(36px,5vw,58px);line-height:1;margin:12px 0 18px;letter-spacing:-.04em}.desc{color:var(--muted);line-height:1.6}.price{font-size:34px;font-weight:800;margin:24px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.fact{background:#f7f4ee;border-radius:12px;padding:14px}.fact span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}.fact strong{display:block;margin-top:5px}.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--dark);color:#fff;font-weight:800;cursor:pointer}.specs{margin-top:24px}.specs div{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #eee}.specs dt{color:var(--muted)}.status{padding:20px;background:#fff;border:1px solid var(--line);border-radius:16px}@media(max-width:820px){.product{grid-template-columns:1fr}.media{min-height:360px}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="/">FitConnect</a><a href="/shop/">Shop</a></header>
<main class="wrap"><a class="back" href="/shop/">← Terug naar shop</a><div id="status" class="status">Product laden…</div><section id="product" class="product" hidden><div id="media" class="media"></div><article class="panel"><div id="category" class="eyebrow"></div><h1 id="name"></h1><p id="desc" class="desc"></p><div id="price" class="price"></div><div class="facts"><div class="fact"><span>Merk</span><strong id="brand"></strong></div><div class="fact"><span>Model</span><strong id="model"></strong></div><div class="fact"><span>Levertijd</span><strong id="delivery"></strong></div></div><button id="add" class="btn" type="button">Toevoegen aan winkelmand</button><dl id="specs" class="specs"></dl></article></section></main>
<script>
(()=>{'use strict';
const API='https://lwpiqshyqzsgwejvmbyo.supabase.co/rest/v1',KEY='sb_publishable_b4uU82UPeAcOGFtyvx5NxA_6e3A_RBj',headers={apikey:KEY,Authorization:'Bearer '+KEY};
const slug=new URLSearchParams(location.search).get('slug');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n||0));let current=null;
function add(){if(!current)return;let items=[];try{items=JSON.parse(localStorage.getItem('fitconnect-cart')||'[]')}catch{}const found=items.find(i=>i.productId===current.id);if(found)found.quantity=Number(found.quantity||1)+1;else items.push({productId:current.id,quantity:1});localStorage.setItem('fitconnect-cart',JSON.stringify(items));$('add').textContent='Toegevoegd ✓'}
async function init(){if(!slug){$('status').textContent='Geen product geselecteerd.';return}try{const url=`${API}/products?select=id,slug,brand,model,name,category,price,delivery,warranty,short_description,description,images,specifications&slug=eq.${encodeURIComponent(slug)}&status=eq.active&limit=1`;const r=await fetch(url,{headers,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const rows=await r.json();current=rows[0];if(!current){$('status').textContent='Dit product is niet beschikbaar.';return}document.title=current.name+' | FitConnect Shop';$('status').hidden=true;$('product').hidden=false;$('category').textContent=current.category||'Product';$('name').textContent=current.name;$('desc').textContent=current.description||current.short_description||'';$('price').textContent=euro(current.price);$('brand').textContent=current.brand||'—';$('model').textContent=current.model||'—';$('delivery').textContent=current.delivery||'In overleg';const img=Array.isArray(current.images)?current.images.find(v=>typeof v==='string'&&/^https?:\/\//.test(v)):'';if(img)$('media').style.backgroundImage=`url('${img.replace(/'/g,"%27")}')`;const specs=current.specifications&&typeof current.specifications==='object'?current.specifications:{};$('specs').innerHTML=Object.entries(specs).slice(0,18).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');$('add').onclick=add}catch(e){console.error(e);$('status').textContent='De productgegevens konden niet worden geladen.'}}
init();
})();
</script>
</body>
</html>
